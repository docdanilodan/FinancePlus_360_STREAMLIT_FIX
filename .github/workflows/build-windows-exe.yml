name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: ["main", "finance-plus-gold-generale-v1"]
    paths:
      - "*.py"
      - "*.spec"
      - "requirements.txt"
      - ".streamlit/**"
      - ".github/workflows/build-windows-exe.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: Build executable
        run: pyinstaller --noconfirm --clean FINANCE_PLUS_GOLD_GENERALE.spec
      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/FINANCE_PLUS_GOLD_GENERALE.exe")) { throw "EXE non generato" }
          Get-Item "dist/FINANCE_PLUS_GOLD_GENERALE.exe" | Format-List Name,Length,LastWriteTime
      - uses: actions/upload-artifact@v4
        with:
          name: FINANCE_PLUS_GOLD_GENERALE_WINDOWS
          path: dist/FINANCE_PLUS_GOLD_GENERALE.exe
          if-no-files-found: error
          retention-days: 30
